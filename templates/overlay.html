<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Pédales</title>
    <style>
        :root { --bg: #121211; --text: #fff; --muted: #8f8e85; --throttle: #199e70; --brake: #e66767; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            background: var(--bg); color: var(--text); overflow: hidden; user-select: none; cursor: move;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums;
            display: flex; justify-content: center; gap: 10px; padding: 8px 10px;
            border: 1px solid #333331;
        }
        .pedal { width: 40px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .pct { font-size: 13px; font-weight: 700; white-space: nowrap; }
        .bar { flex: 1; width: 100%; background: #262624; border-radius: 3px; position: relative; overflow: hidden; }
        .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; }
        .name { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
        #throttle-fill { background: var(--throttle); }
        #brake-fill { background: var(--brake); }
        body.off .pct { color: var(--muted); }
    </style>
</head>
<body class="off" title="iRacing non lancé">
<div class="pedal"><span class="pct" id="throttle-pct">0 %</span><div class="bar"><div class="fill" id="throttle-fill"></div></div><span class="name">Gaz</span></div>
<div class="pedal"><span class="pct" id="brake-pct">0 %</span><div class="bar"><div class="fill" id="brake-fill"></div></div><span class="name">Frein</span></div>

<script>
    const $ = id => document.getElementById(id);
    function setPedal(name, value) {
        // value entre 0 et 1 : hauteur de la barre et pourcentage au-dessus
        const pct = Math.round(Math.min(1, Math.max(0, value || 0)) * 100);
        $(`${name}-fill`).style.height = `${pct}%`;
        $(`${name}-pct`).textContent = `${pct} %`;
    }
    function show(live, throttle, brake, title) {
        document.body.classList.toggle('off', !live);
        document.body.title = title;
        setPedal('throttle', live ? throttle : 0);
        setPedal('brake', live ? brake : 0);
    }
    async function refresh() {
        try {
            const s = await (await fetch('/api/status')).json();
            const live = s.connected && s.on_track;
            show(live, s.throttle, s.brake, live ? '' : s.connected ? 'Pas en piste' : 'iRacing non lancé');
        } catch (err) {
            show(false, 0, 0, 'Serveur injoignable');
        }
    }
    setInterval(refresh, 50);
    refresh();
</script>
</body>
</html>
